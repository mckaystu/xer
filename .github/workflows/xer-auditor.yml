name: Xer Code Auditor

on:
  push:
    paths:
      - "analytics/code_auditor/**"
      - "tests/audit/**"
      - "tests/test_domino_handle_audit.py"
      - "tests/test_loop_severity_and_upgrade_scan.py"
      - "scripts/ci_audit.py"
      - ".github/workflows/xer-auditor.yml"
  pull_request:
    paths:
      - "analytics/code_auditor/**"
      - "tests/audit/**"
      - "tests/test_domino_handle_audit.py"
      - "tests/test_loop_severity_and_upgrade_scan.py"
      - "scripts/ci_audit.py"
      - ".github/workflows/xer-auditor.yml"

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Unit tests (auditor)
        run: |
          python -m pytest tests/audit/ tests/test_domino_handle_audit.py tests/test_loop_severity_and_upgrade_scan.py -q
      - name: CI gate on fixture samples
        run: |
          python scripts/ci_audit.py tests/audit/fixtures --max-critical 200 --max-unprotected 200 --max-incomplete 200 --max-high 500
